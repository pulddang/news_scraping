# 수집할 언론사 목록
#
# key        : 고유 이름 (영문, 바꾸면 새 언론사로 취급돼요)
# name       : 화면에 보일 이름
# feed_url   : RSS/Atom 주소
# country    : 국가 코드 (KR, US, GB ...)
# lang       : 기사 언어 (ko, en)
# category   : 기본 카테고리 (general, politics, economy, society, world, tech, science, culture)
# enabled    : false로 두면 수집하지 않아요
# title_suffix : 제목 끝에 붙는 꼬리표를 지울 때 사용 (Google News 경유 피드용)
#
# 주소는 각 언론사가 공개한 RSS 기준이에요. 서버에서
#   docker compose run --rm collector python -m app.cli check-sources
# 를 실행하면 각 피드가 실제로 동작하는지 확인할 수 있어요.

